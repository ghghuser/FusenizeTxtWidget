name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # icon/icon.png（正方形のPNG、1024x1024推奨）をリポジトリに置くと、アプリアイコンとして使われる
      - name: Apply custom launcher icon
        run: |
          if [ -f icon/icon.png ]; then
            command -v convert >/dev/null || sudo apt-get install -y imagemagick
            mkdir -p app/src/main/res/drawable-nodpi
            convert icon/icon.png -background none -resize 432x432 -gravity center -extent 432x432 \
              app/src/main/res/drawable-nodpi/ic_launcher_custom.png
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <background android:drawable="@color/ic_launcher_background" />' \
              '    <foreground android:drawable="@drawable/ic_launcher_custom" />' \
              '</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo "custom icon applied"
          else
            echo "no icon/icon.png - using default icon"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FusenizeTxtWidget-build${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FusenizeTxtWidget-build${{ github.run_number }}-debug
          path: dist/FusenizeTxtWidget-build${{ github.run_number }}-debug.apk
          if-no-files-found: error
