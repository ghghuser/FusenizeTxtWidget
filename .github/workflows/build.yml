name: Build debug APK

on:
  push:
    branches: [main]
    # 文書だけの変更ではビルドしない（タグのpushは対象外＝常にビルド）
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # icon/icon.svg だけがある場合は、先にPNG(1024x1024)へ変換する（icon.png があればそちらを優先）
      - name: Convert SVG icon to PNG
        run: |
          if [ -f icon/icon.svg ] && [ ! -f icon/icon.png ]; then
            pip install --break-system-packages --quiet cairosvg 2>/dev/null || true
            python3 -c "import cairosvg; cairosvg.svg2png(url='icon/icon.svg', write_to='icon/icon.png', output_width=1024, output_height=1024)" \
              || { command -v rsvg-convert >/dev/null && rsvg-convert -w 1024 -h 1024 icon/icon.svg -o icon/icon.png; } \
              || { command -v inkscape >/dev/null && inkscape icon/icon.svg -w 1024 -h 1024 -o icon/icon.png; } \
              || echo "SVG conversion failed - using default icon"
          fi
          exit 0

      # icon/icon.png（正方形のPNG、1024x1024推奨）をリポジトリに置くと、アプリアイコンとして使われる
      - name: Apply custom launcher icon
        run: |
          if [ -f icon/icon.png ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            OUT=app/src/main/res/drawable-nodpi/ic_launcher_custom.png
            ok=0
            if command -v magick >/dev/null; then
              magick icon/icon.png -background none -resize 432x432 -gravity center -extent 432x432 "$OUT" && ok=1
            elif command -v convert >/dev/null; then
              convert icon/icon.png -background none -resize 432x432 -gravity center -extent 432x432 "$OUT" && ok=1
            fi
            if [ $ok = 0 ]; then
              pip install --break-system-packages --quiet pillow 2>/dev/null || true
              python3 - "$OUT" <<'PY' && ok=1
          import sys
          from PIL import Image
          im = Image.open("icon/icon.png").convert("RGBA")
          im.thumbnail((432, 432))
          c = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          c.paste(im, ((432 - im.width) // 2, (432 - im.height) // 2))
          c.save(sys.argv[1])
          PY
            fi
            if [ $ok = 0 ]; then
              echo "icon conversion failed - using default icon"
              exit 0
            fi
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <background android:drawable="@color/ic_launcher_background" />' \
              '    <foreground android:drawable="@drawable/ic_launcher_custom" />' \
              '</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo "custom icon applied"
          else
            echo "no icon/icon.png - using default icon"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FusenizeTxtWidget-build${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FusenizeTxtWidget-build${{ github.run_number }}-debug
          path: dist/FusenizeTxtWidget-build${{ github.run_number }}-debug.apk
          if-no-files-found: error
